name: Build and Publish Docker Image

# A imagem é publicada a partir de uma TAG, não de push na main.
#
# Antes o gatilho era "push na main", o que misturava duas decisões distintas:
# integrar código e publicar uma release. Como o Dockerfile faz COPY . ., até um
# commit de documentação republicava a mesma versão com um digest diferente,
# invalidando silenciosamente qualquer deploy que fixasse o digest — foi o que
# aconteceu com a 0.7.3, publicada duas vezes.
#
# Agora integrar na main é livre, e a imagem só nasce quando você corta a tag.
# Tag git, release e digest passam a nascer juntos por construção.
#
#   git tag -a 0.7.4 -m "..." && git push origin 0.7.4
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:

jobs:
  build_deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # A versão vem da tag, e o arquivo VERSION precisa concordar com ela.
      # Sem essa checagem dá para publicar uma imagem :0.7.4 cujo binário reporta
      # 0.7.3 — divergência que só aparece depois, em produção, quando alguém
      # tenta descobrir o que está rodando.
      - name: Resolve version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::Esta workflow publica a partir de tags. Rode-a selecionando uma tag, ou empurre uma: git tag -a 0.7.4 -m '...' && git push origin 0.7.4"
            exit 1
          fi
          tag="$GITHUB_REF_NAME"
          file="$(tr -d '[:space:]' < VERSION)"
          if [ "$tag" != "$file" ]; then
            echo "::error::A tag '$tag' não bate com o arquivo VERSION ('$file'). Ajuste o VERSION, faça o commit e recrie a tag."
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ecosb2b/evo-go-v2
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ !contains(steps.version.outputs.version, '-beta') }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.version }}

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}
